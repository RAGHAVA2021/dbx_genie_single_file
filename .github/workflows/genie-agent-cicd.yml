name: Genie Agent CI/CD

on:
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options: [validate-only, dev, prod]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: sales-genie validate-config --config config/environments/dev.yml
      - run: sales-genie validate-config --config config/environments/prod.yml
      - run: sales-genie compare-dev-prod
      - run: sales-genie generate-bundle --config config/environments/dev.yml
      - run: sales-genie generate-bundle --config config/environments/prod.yml
      - run: pytest
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-dev:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'dev'
    needs: validate
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write # workload-identity federation; only the deploying jobs may mint a token
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: databricks/setup-cli@v1.17.0
        with:
          version: 1.17.0 # the CLI release whose bundle schema this repo was verified against
      - run: python -m pip install -e '.[dev]'
      - run: sales-genie validate-config --config config/environments/dev.yml --deployment
      - run: sales-genie generate-bundle --config config/environments/dev.yml --deployment
      - run: databricks bundle validate --strict --target dev
      - run: databricks bundle deploy --target dev
      - name: Resolve deployed Agent and run smoke tests
        run: |
          databricks bundle summary --target dev --output json > bundle-summary.json
          agent_id="$(jq -r '.resources.genie_spaces.sales_genie.id' bundle-summary.json)"
          test -n "$agent_id" && test "$agent_id" != "null"
          sales-genie run-smoke-tests --config config/environments/dev.yml --agent-id "$agent_id"
          sales-genie export-agent --config config/environments/dev.yml --agent-id "$agent_id" --output exports/dev-agent.json
      - uses: actions/upload-artifact@v4
        with: {name: dev-genie-agent-export, path: exports/dev-agent.json}

  deploy-prod:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    needs: validate
    runs-on: ubuntu-latest
    environment: prod # configure required reviewers and separate prod credentials
    permissions:
      contents: read
      id-token: write # workload-identity federation; only the deploying jobs may mint a token
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: databricks/setup-cli@v1.17.0
        with:
          version: 1.17.0 # the CLI release whose bundle schema this repo was verified against
      - run: python -m pip install -e '.[dev]'
      - run: sales-genie validate-config --config config/environments/prod.yml --deployment
      - run: sales-genie generate-bundle --config config/environments/prod.yml --deployment
      - name: Back up the current production Agent when present
        run: |
          if databricks bundle summary --target prod --output json > bundle-summary-before.json; then
            agent_id="$(jq -r '.resources.genie_spaces.sales_genie.id // empty' bundle-summary-before.json)"
            if test -n "$agent_id"; then
              sales-genie export-agent --config config/environments/prod.yml --agent-id "$agent_id" --output backups/prod-before-deploy.json
            fi
          fi
      - run: databricks bundle validate --strict --target prod
      - run: databricks bundle deploy --target prod
      - name: Resolve deployed Agent and run smoke tests
        run: |
          databricks bundle summary --target prod --output json > bundle-summary.json
          agent_id="$(jq -r '.resources.genie_spaces.sales_genie.id' bundle-summary.json)"
          test -n "$agent_id" && test "$agent_id" != "null"
          sales-genie run-smoke-tests --config config/environments/prod.yml --agent-id "$agent_id"
          sales-genie export-agent --config config/environments/prod.yml --agent-id "$agent_id" --output exports/prod-agent.json
      - uses: actions/upload-artifact@v4
        with:
          name: prod-genie-agent-export-and-backup
          path: |
            exports/prod-agent.json
            backups/prod-before-deploy.json
          if-no-files-found: warn
